[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "price-check-ke-api"
version = "0.1.0"
description = "API for Kenya food-market trend data, summaries, and AI exploration"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "joblib==1.6.0",
    "openai>=2.0,<3.0",
    "scikit-learn==1.9.1",
    "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.13,<3.0",
    "pytest>=8.3,<9.0",
    "ruff>=0.11,<1.0",
]
ml = [
    "pandas>=2.2,<3.0",
    "numpy>=1.26,<3.0",
    "matplotlib>=3.9,<4.0",
    "jupyter>=1.1,<2.0",
    "openpyxl>=3.1,<4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
